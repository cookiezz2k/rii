<style>
:root{--bg:#fff0f5;--ink:#4a1030;--muted:#a1527c;--line:#f3c9df;--accent:#e63980}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{scroll-behavior:smooth;overflow:hidden}
body{background:radial-gradient(circle at 20% 15%,#ffeaf3 0%,var(--bg) 45%,#ffd3e8 100%);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;line-height:1.5;height:100%;overflow:hidden;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:24px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative;z-index:1}
section{margin-top:5vh}
section:first-child{margin-top:0}
h2{font-size:1.35rem;font-weight:500}
ul{list-style:none;padding:0;margin-top:16px;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
a.link{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:18px 4px;color:inherit;text-decoration:none;transition:padding .2s,color .2s}
a.link:hover{padding-left:12px;color:var(--accent)}
a.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.platform{font-weight:500;display:flex;align-items:center;gap:12px}
.icon{width:24px;height:24px;flex:none}
.handle{color:var(--muted);font-weight:300;font-size:.95rem;overflow-wrap:anywhere;text-align:right}

.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg span{position:absolute;left:var(--l);bottom:-12vh;width:var(--s);height:var(--s);
  -webkit-mask-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 29.6"><path fill="%23000" d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.5-9.3,16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg>');
  mask-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 29.6"><path fill="%23000" d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.5-9.3,16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg>');
  -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  animation:rise var(--t) linear var(--d) infinite}
.bg .a{background:#ffb3c6}
.bg .b{background:#e3b8f0}
.bg .o{background:#ffd8b1}
@keyframes rise{0%{transform:translate(0,0) rotate(-6deg) scale(.85);opacity:0}10%{opacity:.85}50%{transform:translate(24px,-65vh) rotate(6deg) scale(1.05)}90%{opacity:.85}100%{transform:translate(-16px,-125vh) rotate(-4deg) scale(.85);opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}.bg span{animation:none;bottom:var(--p)}}
</style>
